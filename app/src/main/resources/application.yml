server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: index12306-app
  profiles:
    active: dev
  # JPA/Hibernate 关闭，使用 MyBatis-Plus
  jpa:
    open-in-view: false

  # PostgreSQL 数据源
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/index12306?stringtype=unspecified
    username: postgres
    password: "12345678"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: "123456"
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# Redisson 配置（与 Redis 共用）
redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:6379"
      password: "123456"
      database: 0
      connectionMinimumIdleSize: 8
      connectionPoolSize: 32

# RocketMQ
rocketmq:
  name-server: localhost:9876
  producer:
    group: index12306-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# 安全配置（密钥默认硬编码兜底，生产环境通过环境变量或配置中心覆盖）
security:
  jwt-secret: 
  aes-secret: 

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    org.opengoofy.index12306: debug

# AI 客服
ai:
  chat:
    provider: deepseek
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash
    temperature: 0.7
    timeout-ms: 60000
    rate-limit-per-minute: 30
    worker-core-size: 8
    worker-max-size: 32
    worker-queue-capacity: 128
    global-max-concurrent: 32
    user-max-concurrent: 1
    rag-cache-ttl-seconds: 300
    system-prompt-file: config/customer-service-system-prompt.md
  embedding:
    base-url: http://localhost:11434/v1
    api-key: ollama
    model: qwen3-embedding:0.6b
    dimension: 1024
    timeout-ms: 30000
    batch-size: 20
    max-concurrent: 4
  rerank:
    enabled: false
    base-url: http://localhost:11434/v1
    api-key: ollama
    model: qwen3.5:4b
    top-n: 3
    timeout-ms: 30000

# 文件存储（RustFS / S3 兼容）
file-storage:
  endpoint: http://localhost:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: index12306-kb
  region: us-east-1
